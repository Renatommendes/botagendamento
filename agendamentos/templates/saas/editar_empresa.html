<h2>Editar Empresa</h2>

<form method="POST">
    {% csrf_token %}

    <input name="nome" value="{{ empresa.nome }}"><br>
    <input name="verify_token" value="{{ empresa.verify_token }}"><br>
    <input name="whatsapp_access_token" value="{{ empresa.whatsapp_access_token }}"><br>
    <input name="whatsapp_phone_number_id" value="{{ empresa.whatsapp_phone_number_id }}"><br>
    <input name="google_calendar_id" value="{{ empresa.google_calendar_id }}"><br>

    <button type="submit">Salvar</button>
</form>
